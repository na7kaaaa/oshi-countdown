<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>推し活カウントダウン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFCF2;
    --card: #FFFFFF;
    --ink: #3D3222;
    --sub: #A6935F;
    --line: #F4E9C8;
    --accent: #FFC93C;
    --accent-soft: #FFF3CB;
    --lav: #F2A03D;
    --lav-soft: #FFE9C7;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    font-family: "Nunito", "Hiragino Sans", sans-serif;
    color: var(--ink);
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 14px;
  }

  .widget {
    width: 100%;
    max-width: 360px;
    background: var(--card);
    border-radius: 20px;
    padding: 22px 22px 18px;
    box-shadow: 0 10px 30px rgba(124, 111, 166, 0.08);
    border: 1px solid var(--line);
  }

  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
  }

  .row + .row {
    border-top: 1px solid var(--line);
  }

  .icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    flex-shrink: 0;
  }

  .row.birthday .icon { background: var(--accent-soft); }
  .row.event .icon { background: var(--lav-soft); }

  .row-body { flex: 1; min-width: 0; }

  .row-label {
    font-family: "Zen Maru Gothic", sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--sub);
    margin: 0 0 2px;
    white-space: normal;
    overflow-wrap: break-word;
    line-height: 1.3;
  }

  .row-date {
    font-size: 13.5px;
    color: var(--ink);
    opacity: 0.75;
    margin: 0;
  }

  .pill {
    font-family: "Zen Maru Gothic", sans-serif;
    font-weight: 700;
    font-size: 13.5px;
    padding: 7px 12px;
    border-radius: 999px;
    white-space: nowrap;
    color: var(--ink);
    flex-shrink: 0;
  }

  .row.birthday .pill { background: var(--accent); }
  .row.event .pill { background: var(--lav); }

  .pill.today {
    background: linear-gradient(135deg, #FFC93C, #F2A03D);
  }

  .pill.past {
    background: #EDE6D0;
    color: #8A7D5C;
  }

  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px dashed var(--line);
  }

  #nowText {
    font-size: 11px;
    color: var(--sub);
  }

  #editBtn {
    font-family: "Zen Maru Gothic", sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    color: #8A5A00;
    background: var(--lav-soft);
    border: none;
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  #editBtn:hover {
    background: #FFDCA0;
    transform: translateY(-1px);
  }

  #editBtn:focus-visible {
    outline: 2px solid #8A5A00;
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    #editBtn { transition: none; }
  }

  @media (max-width: 260px) {
    .widget {
      padding: 16px 14px 14px;
      border-radius: 16px;
    }

    .row {
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 0;
    }

    .icon {
      width: 32px;
      height: 32px;
      font-size: 16px;
      border-radius: 10px;
    }

    .row-body {
      flex-basis: calc(100% - 44px);
    }

    .pill {
      margin-left: 44px;
      font-size: 12.5px;
    }

    .footer {
      flex-wrap: wrap;
      gap: 8px;
    }
  }
</style>
</head>
<body>

  <div class="widget">
    <div class="row birthday">
      <div class="icon">🎂</div>
      <div class="row-body">
        <p class="row-label" id="bLabel">推し誕生日</p>
        <p class="row-date" id="bDateText">—</p>
      </div>
      <span class="pill" id="bCountdown">—</span>
    </div>

    <div class="row event">
      <div class="icon">⏳</div>
      <div class="row-body">
        <p class="row-label" id="eLabel">次のイベント</p>
        <p class="row-date" id="eDateText">—</p>
      </div>
      <span class="pill" id="eCountdown">—</span>
    </div>

    <div class="footer">
      <span id="nowText"></span>
      <button id="editBtn" type="button">日付を編集</button>
    </div>
  </div>

<script>
  // =========================
  //  推し活ウィジェット（index完結版）
  //  - 次の試合 → 次のイベント
  //  - 日付は localStorage に保存（ボタンで随時更新）
  // =========================

  // 表示・計算設定（必要ならここだけ）
  const LOCALE = "ja-JP";
  const TIMEZONE = "Asia/Tokyo";
  const STORAGE_KEY = "oshi_widget_data_v1";

  // 初期データ（最初だけ使われる。以後はボタンで更新した内容が優先）
  const DEFAULT_DATA = {
    oshiName: "推し",
    birthday: "2000-08-06", // 年は仮でOK（毎年の次の誕生日を計算）
    events: [
      { name: "次のイベント", date: "2026-01-05" }
    ]
  };

  const $ = (id) => document.getElementById(id);

  function parseYMD(ymd) {
    // timezoneズレを避けるため「UTC正午」で扱う
    const [y, m, d] = ymd.split("-").map(Number);
    return new Date(Date.UTC(y, m - 1, d, 12, 0, 0));
  }

  function tokyoTodayUTCNoon() {
    const now = new Date();
    const parts = new Intl.DateTimeFormat(LOCALE, {
      timeZone: TIMEZONE,
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).formatToParts(now);

    const y = parts.find(p => p.type === "year").value;
    const m = parts.find(p => p.type === "month").value;
    const d = parts.find(p => p.type === "day").value;
    return parseYMD(`${y}-${m}-${d}`);
  }

  function daysDiff(fromUTCNoon, toUTCNoon) {
    const ms = toUTCNoon - fromUTCNoon;
    return Math.round(ms / (1000 * 60 * 60 * 24));
  }

  function formatDate(ymd) {
    const dt = parseYMD(ymd);
    return new Intl.DateTimeFormat(LOCALE, {
      timeZone: TIMEZONE,
      year: "numeric",
      month: "long",
      day: "numeric",
      weekday: "short"
    }).format(dt);
  }

  function tokyoCurrentYear() {
    const parts = new Intl.DateTimeFormat(LOCALE, {
      timeZone: TIMEZONE,
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).formatToParts(new Date());
    return Number(parts.find(p => p.type === "year").value);
  }

  function nextBirthday(birthdayYMD, baseDateUTCNoon) {
    const [, mm, dd] = birthdayYMD.split("-").map(Number);

    const yearNow = tokyoCurrentYear();

    let target = new Date(Date.UTC(yearNow, mm - 1, dd, 12, 0, 0));
    if (daysDiff(baseDateUTCNoon, target) < 0) {
      target = new Date(Date.UTC(yearNow + 1, mm - 1, dd, 12, 0, 0));
    }

    const y = target.getUTCFullYear();
    const m = String(target.getUTCMonth() + 1).padStart(2, "0");
    const d = String(target.getUTCDate()).padStart(2, "0");
    return { ymd: `${y}-${m}-${d}`, dt: target };
  }

  function setPill(el, diff) {
    el.classList.remove("today", "past");
    if (diff === 0) {
      el.textContent = "🎉 今日！";
      el.classList.add("today");
    } else if (diff > 0) {
      el.textContent = `あと ${diff}日`;
    } else {
      el.textContent = `${Math.abs(diff)}日 経過`;
      el.classList.add("past");
    }
  }

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return structuredClone(DEFAULT_DATA);
      const parsed = JSON.parse(raw);

      // 最低限の整形
      if (!parsed.oshiName) parsed.oshiName = DEFAULT_DATA.oshiName;
      if (!parsed.birthday) parsed.birthday = DEFAULT_DATA.birthday;
      if (!Array.isArray(parsed.events)) parsed.events = structuredClone(DEFAULT_DATA.events);
      return parsed;
    } catch {
      return structuredClone(DEFAULT_DATA);
    }
  }

  function saveData(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function pickNearestUpcomingEvent(events, baseDateUTCNoon) {
    // 未来の最短を優先、なければ一番近い過去
    let bestFuture = null;
    let bestPast = null;

    for (const ev of events) {
      if (!ev?.date) continue;
      const dt = parseYMD(ev.date);
      const diff = daysDiff(baseDateUTCNoon, dt);

      if (diff >= 0) {
        if (!bestFuture || diff < bestFuture.diff) bestFuture = { ...ev, dt, diff };
      } else {
        if (!bestPast || diff > bestPast.diff) bestPast = { ...ev, dt, diff };
      }
    }
    return bestFuture || bestPast || null;
  }

  function render() {
    const base = tokyoTodayUTCNoon();
    const data = loadData();

    // 誕生日
    $("bLabel").textContent = `推し誕生日（${data.oshiName || "推し"}）`;
    const bTarget = nextBirthday(data.birthday, base);
    $("bDateText").textContent = formatDate(bTarget.ymd);
    setPill($("bCountdown"), daysDiff(base, bTarget.dt));

    // 次のイベント（最短を自動表示）
    const ev = pickNearestUpcomingEvent(data.events || [], base);
    $("eLabel").textContent = ev?.name || "次のイベント";
    $("eDateText").textContent = ev?.date ? formatDate(ev.date) : "—";
    setPill($("eCountdown"), ev ? ev.diff : 0);

    // 更新時刻
    const now = new Date();
    $("nowText").textContent =
      "更新: " +
      new Intl.DateTimeFormat(LOCALE, {
        timeZone: TIMEZONE,
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }).format(now);
  }

  function normalizeDateInput(raw) {
    if (raw === null) return null;
    const half = raw
      .trim()
      .replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
      .replace(/[／．.]/g, "-")
      .replace(/\//g, "-");

    const m = half.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (!m) return null;

    const yyyy = m[1];
    const mm = String(Number(m[2])).padStart(2, "0");
    const dd = String(Number(m[3])).padStart(2, "0");

    if (Number(mm) < 1 || Number(mm) > 12 || Number(dd) < 1 || Number(dd) > 31) return null;
    return `${yyyy}-${mm}-${dd}`;
  }

  function quickEdit() {
    const data = loadData();

    const name = prompt("推しの呼び名（表示用）", data.oshiName);
    if (name !== null && name.trim() !== "") data.oshiName = name.trim();

    const b = prompt("推しの誕生日（YYYY-MM-DD / 年は仮でOK）", data.birthday);
    if (b !== null) {
      const normalized = normalizeDateInput(b);
      if (normalized) {
        data.birthday = normalized;
      } else if (b.trim() !== "") {
        alert("誕生日の形式が正しくないので、変更されませんでした。\n例：2000-08-06");
      }
    }

    // 複数イベントを「名前@日付」で改行入力（簡単で強い）
    // 例：
    // 次のイベント@2026-01-05
    // 現地予定@2026-01-18
    const currentLines = (data.events || [])
      .map(ev => `${ev.name || "次のイベント"}@${ev.date}`)
      .join("\n");

    const lines = prompt(
      "イベント一覧（1行= 名前@YYYY-MM-DD ）\n例）次のイベント@2026-01-05",
      currentLines || "次のイベント@2026-01-05"
    );

    if (lines !== null) {
      const rawRows = lines
        .split("\n")
        .map(s => s.trim())
        .filter(Boolean);

      const events = [];
      const invalidRows = [];

      for (const row of rawRows) {
        const [n, d] = row.split("@").map(x => (x || "").trim());
        const normalized = normalizeDateInput(d);
        if (normalized) {
          events.push({ name: n || "次のイベント", date: normalized });
        } else {
          invalidRows.push(row);
        }
      }

      if (invalidRows.length > 0) {
        alert(
          "以下の行は形式が正しくないので反映されませんでした:\n" +
          invalidRows.join("\n") +
          "\n\n例：次のイベント@2026-01-05"
        );
      }

      // 1個も正しい日付がなければ既存を保持
      if (events.length > 0) data.events = events;
    }

    // 表示名は「次の試合」ではなく「次のイベント」へ寄せる
    // （ユーザー入力で自由にできるけど、空の時はこれ）
    data.events = (data.events || []).map(ev => ({
      name: ev.name || "次のイベント",
      date: ev.date
    }));

    saveData(data);
    render();
  }

  // ===== 初期化 =====
  // 既存データがなければ保存しておく（初回でも動く）
  if (!localStorage.getItem(STORAGE_KEY)) saveData(structuredClone(DEFAULT_DATA));

  const editBtn = document.getElementById("editBtn");
  if (editBtn) editBtn.addEventListener("click", quickEdit);

  render();
  setInterval(render, 60 * 60 * 1000); // 1時間ごと更新
</script>
</body>
</html>
