<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>推し活カウントダウン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFCF2;
    --card: #FFFFFF;
    --ink: #3D3222;
    --sub: #A6935F;
    --line: #F4E9C8;
    --accent: #FFC93C;
    --accent-soft: #FFF3CB;
    --lav: #F2A03D;
    --lav-soft: #FFE9C7;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    font-family: "Nunito", "Hiragino Sans", sans-serif;
    color: var(--ink);
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 14px;
  }

  .widget {
    width: 100%;
    max-width: 360px;
    background: var(--card);
    border-radius: 20px;
    padding: 22px 22px 18px;
    box-shadow: 0 10px 30px rgba(124, 111, 166, 0.08);
    border: 1px solid var(--line);
  }

  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
  }

  .row + .row {
    border-top: 1px solid var(--line);
  }

  .icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    flex-shrink: 0;
  }

  .row.birthday .icon { background: var(--accent-soft); }
  .row.event .icon { background: var(--lav-soft); }

  .row-body { flex: 1; min-width: 0; }

  .row-label {
    font-family: "Zen Maru Gothic", sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--sub);
    margin: 0 0 2px;
    white-space: normal;
    overflow-wrap: break-word;
    line-height: 1.3;
  }

  .row-date {
    font-size: 13.5px;
    color: var(--ink);
    opacity: 0.75;
    margin: 0;
  }

  .pill {
    font-family: "Zen Maru Gothic", sans-serif;
    font-weight: 700;
    font-size: 13.5px;
    padding: 7px 12px;
    border-radius: 999px;
    white-space: nowrap;
    color: var(--ink);
    flex-shrink: 0;
  }

  .row.birthday .pill { background: var(--accent); }
  .row.event .pill { background: var(--lav); }

  .pill.today {
    background: linear-gradient(135deg, #FFC93C, #F2A03D);
  }

  .pill.past {
    background: #EDE6D0;
    color: #8A7D5C;
  }

  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px dashed var(--line);
  }

  #nowText {
    font-size: 11px;
    color: var(--sub);
  }

  .storage-warning {
    font-size: 10.5px;
    color: #B5651D;
    margin: 8px 0 0;
    line-height: 1.4;
  }

  #editBtn {
    font-family: "Zen Maru Gothic", sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    color: #8A5A00;
    background: var(--lav-soft);
    border: none;
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  #editBtn:hover {
    background: #FFDCA0;
    transform: translateY(-1px);
  }

  #editBtn:focus-visible {
    outline: 2px solid #8A5A00;
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    #editBtn { transition: none; }
  }

  @media (max-width: 260px) {
    .widget {
      padding: 16px 14px 14px;
      border-radius: 16px;
    }

    .row {
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 0;
    }

    .icon {
      width: 32px;
      height: 32px;
      font-size: 16px;
      border-radius: 10px;
    }

    .row-body {
      flex-basis: calc(100% - 44px);
    }

    .pill {
      margin-left: 44px;
      font-size: 12.5px;
    }

    .footer {
      flex-wrap: wrap;
      gap: 8px;
    }
  }

  /* ===== 編集モーダル ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(61, 50, 34, 0.35);
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 100;
  }

  .modal-overlay.open {
    display: flex;
  }

  .modal {
    width: 100%;
    max-width: 320px;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    background: var(--card);
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 20px 50px rgba(61, 50, 34, 0.25);
  }

  .modal-title {
    font-family: "Zen Maru Gothic", sans-serif;
    font-size: 16px;
    margin: 0 0 14px;
    color: var(--ink);
  }

  .field {
    display: block;
    margin-bottom: 12px;
    font-size: 12.5px;
    color: var(--sub);
    font-family: "Zen Maru Gothic", sans-serif;
  }

  .field > span {
    display: block;
    margin-bottom: 5px;
  }

  .field input[type="text"],
  .field input[type="date"] {
    width: 100%;
    font-family: "Nunito", sans-serif;
    font-size: 14px;
    color: var(--ink);
    padding: 8px 10px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #FFFDF7;
  }

  .field input:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .event-row {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }

  .event-row .ev-name {
    flex: 1.3;
    min-width: 0;
  }

  .event-row .ev-date {
    flex: 1;
    min-width: 0;
  }

  .event-row .remove-btn {
    flex-shrink: 0;
    width: 30px;
    border: none;
    border-radius: 8px;
    background: var(--line);
    color: var(--sub);
    font-size: 15px;
    cursor: pointer;
  }

  .ghost-btn {
    font-family: "Zen Maru Gothic", sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    color: #8A5A00;
    background: var(--lav-soft);
    border: none;
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
  }

  .ghost-btn.small {
    padding: 5px 12px;
    font-size: 12px;
  }

  .primary-btn {
    font-family: "Zen Maru Gothic", sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #FFC93C, #F2A03D);
    border: none;
    border-radius: 999px;
    padding: 8px 18px;
    cursor: pointer;
  }

  .modal-error {
    font-size: 12px;
    color: #C0392B;
    min-height: 14px;
    margin: 4px 0 10px;
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 4px;
  }

  .danger-zone {
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px dashed var(--line);
  }

  .reset-link {
    display: block;
    width: 100%;
    text-align: center;
    background: none;
    border: none;
    font-family: "Zen Maru Gothic", sans-serif;
    font-size: 11.5px;
    color: #B08A6B;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px;
  }

  .reset-confirm {
    margin-top: 10px;
    padding: 12px;
    background: #FFF4EE;
    border: 1px solid #F3D9C7;
    border-radius: 12px;
  }

  .reset-confirm p {
    margin: 0 0 10px;
    font-size: 12px;
    color: #8A5A3D;
    line-height: 1.5;
  }

  .reset-confirm-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  .danger-btn {
    font-family: "Zen Maru Gothic", sans-serif;
    font-size: 12.5px;
    font-weight: 700;
    color: #fff;
    background: #E0663F;
    border: none;
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
  }
</style>
</head>
<body>

  <div class="widget">
    <div class="row birthday">
      <div class="icon">🎂</div>
      <div class="row-body">
        <p class="row-label" id="bLabel">推し誕生日</p>
        <p class="row-date" id="bDateText">—</p>
      </div>
      <span class="pill" id="bCountdown">—</span>
    </div>

    <div class="row event">
      <div class="icon">⏳</div>
      <div class="row-body">
        <p class="row-label" id="eLabel">次のイベント</p>
        <p class="row-date" id="eDateText">—</p>
      </div>
      <span class="pill" id="eCountdown">—</span>
    </div>

    <div class="footer">
      <span id="nowText"></span>
      <button id="editBtn" type="button">日付を編集</button>
    </div>
    <p class="storage-warning" id="storageWarning" style="display:none;">
      ※このブラウザでは保存が効かないため、編集内容はタブを閉じるまでのみ反映されます
    </p>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 class="modal-title">日付を編集</h2>

      <label class="field">
        <span>推しの呼び名</span>
        <input type="text" id="inputName" placeholder="推し" />
      </label>

      <label class="field">
        <span>推しの誕生日</span>
        <input type="date" id="inputBirthday" />
      </label>

      <div class="field">
        <span>イベント一覧</span>
        <div id="eventList"></div>
        <button type="button" id="addEventBtn" class="ghost-btn small">＋ イベントを追加</button>
      </div>

      <p class="modal-error" id="modalError"></p>

      <div class="modal-actions">
        <button type="button" id="cancelBtn" class="ghost-btn">キャンセル</button>
        <button type="button" id="saveBtn" class="primary-btn">保存</button>
      </div>

      <div class="danger-zone">
        <button type="button" id="resetBtn" class="reset-link">推し名・日付を初期状態にリセット</button>

        <div class="reset-confirm" id="resetConfirm" style="display:none;">
          <p>推しの名前・誕生日・イベントが全て消えて初期値に戻ります。よろしいですか？</p>
          <div class="reset-confirm-actions">
            <button type="button" id="resetCancelBtn" class="ghost-btn small">やめる</button>
            <button type="button" id="resetConfirmBtn" class="danger-btn">リセットする</button>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  // =========================
  //  推し活ウィジェット（index完結版）
  //  - 次の試合 → 次のイベント
  //  - 日付は localStorage に保存（ボタンで随時更新）
  // =========================

  // 表示・計算設定（必要ならここだけ）
  const LOCALE = "ja-JP";
  const TIMEZONE = "Asia/Tokyo";
  const STORAGE_KEY = "oshi_widget_data_v1";

  // 初期データ（最初だけ使われる。以後はボタンで更新した内容が優先）
  const DEFAULT_DATA = {
    oshiName: "推し",
    birthday: "2000-08-06", // 年は仮でOK（毎年の次の誕生日を計算）
    events: [
      { name: "次のイベント", date: "2026-01-05" }
    ]
  };

  const $ = (id) => document.getElementById(id);

  function parseYMD(ymd) {
    // timezoneズレを避けるため「UTC正午」で扱う
    const [y, m, d] = ymd.split("-").map(Number);
    return new Date(Date.UTC(y, m - 1, d, 12, 0, 0));
  }

  function tokyoTodayUTCNoon() {
    const now = new Date();
    const parts = new Intl.DateTimeFormat(LOCALE, {
      timeZone: TIMEZONE,
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).formatToParts(now);

    const y = parts.find(p => p.type === "year").value;
    const m = parts.find(p => p.type === "month").value;
    const d = parts.find(p => p.type === "day").value;
    return parseYMD(`${y}-${m}-${d}`);
  }

  function daysDiff(fromUTCNoon, toUTCNoon) {
    const ms = toUTCNoon - fromUTCNoon;
    return Math.round(ms / (1000 * 60 * 60 * 24));
  }

  function formatDate(ymd) {
    const dt = parseYMD(ymd);
    return new Intl.DateTimeFormat(LOCALE, {
      timeZone: TIMEZONE,
      year: "numeric",
      month: "long",
      day: "numeric",
      weekday: "short"
    }).format(dt);
  }

  function tokyoCurrentYear() {
    const parts = new Intl.DateTimeFormat(LOCALE, {
      timeZone: TIMEZONE,
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).formatToParts(new Date());
    return Number(parts.find(p => p.type === "year").value);
  }

  function nextBirthday(birthdayYMD, baseDateUTCNoon) {
    const [, mm, dd] = birthdayYMD.split("-").map(Number);

    const yearNow = tokyoCurrentYear();

    let target = new Date(Date.UTC(yearNow, mm - 1, dd, 12, 0, 0));
    if (daysDiff(baseDateUTCNoon, target) < 0) {
      target = new Date(Date.UTC(yearNow + 1, mm - 1, dd, 12, 0, 0));
    }

    const y = target.getUTCFullYear();
    const m = String(target.getUTCMonth() + 1).padStart(2, "0");
    const d = String(target.getUTCDate()).padStart(2, "0");
    return { ymd: `${y}-${m}-${d}`, dt: target };
  }

  function setPill(el, diff) {
    el.classList.remove("today", "past");
    if (diff === 0) {
      el.textContent = "🎉 今日！";
      el.classList.add("today");
    } else if (diff > 0) {
      el.textContent = `あと ${diff}日`;
    } else {
      el.textContent = `${Math.abs(diff)}日 経過`;
      el.classList.add("past");
    }
  }

  // localStorageが使えない環境(一部プライバシー重視ブラウザのiframe埋め込みなど)向けの
  // フォールバック。保存には失敗するが、タブを閉じるまではこの変数で状態を保持する
  let memoryData = null;

  function isStorageAvailable() {
    try {
      const testKey = "__oshi_widget_storage_test__";
      localStorage.setItem(testKey, "1");
      localStorage.removeItem(testKey);
      return true;
    } catch {
      return false;
    }
  }

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        // 最低限の整形
        if (!parsed.oshiName) parsed.oshiName = DEFAULT_DATA.oshiName;
        if (!parsed.birthday) parsed.birthday = DEFAULT_DATA.birthday;
        if (!Array.isArray(parsed.events)) parsed.events = structuredClone(DEFAULT_DATA.events);
        return parsed;
      }
    } catch {
      // localStorageにアクセスできない → メモリ上のデータか初期値にフォールバック
    }
    return memoryData ? structuredClone(memoryData) : structuredClone(DEFAULT_DATA);
  }

  function saveData(data) {
    memoryData = data; // 保存が効かない環境でも、このセッション中だけは反映されるように保持
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch {
      // 保存できない環境。エラーは握りつぶして、呼び出し側の処理は止めない
    }
  }

  function pickNearestUpcomingEvent(events, baseDateUTCNoon) {
    // 未来の最短を優先、なければ一番近い過去
    let bestFuture = null;
    let bestPast = null;

    for (const ev of events) {
      if (!ev?.date) continue;
      const dt = parseYMD(ev.date);
      const diff = daysDiff(baseDateUTCNoon, dt);

      if (diff >= 0) {
        if (!bestFuture || diff < bestFuture.diff) bestFuture = { ...ev, dt, diff };
      } else {
        if (!bestPast || diff > bestPast.diff) bestPast = { ...ev, dt, diff };
      }
    }
    return bestFuture || bestPast || null;
  }

  function render() {
    const base = tokyoTodayUTCNoon();
    const data = loadData();

    // 誕生日
    $("bLabel").textContent = `推し誕生日（${data.oshiName || "推し"}）`;
    const bTarget = nextBirthday(data.birthday, base);
    $("bDateText").textContent = formatDate(bTarget.ymd);
    setPill($("bCountdown"), daysDiff(base, bTarget.dt));

    // 次のイベント（最短を自動表示）
    const ev = pickNearestUpcomingEvent(data.events || [], base);
    $("eLabel").textContent = ev?.name || "次のイベント";
    $("eDateText").textContent = ev?.date ? formatDate(ev.date) : "—";
    setPill($("eCountdown"), ev ? ev.diff : 0);

    // 更新時刻
    const now = new Date();
    $("nowText").textContent =
      "更新: " +
      new Intl.DateTimeFormat(LOCALE, {
        timeZone: TIMEZONE,
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }).format(now);
  }

  // ===== 編集モーダル =====
  const modalOverlay = $("modalOverlay");
  const eventListEl = $("eventList");
  const modalError = $("modalError");

  function addEventRow(name = "", date = "") {
    const row = document.createElement("div");
    row.className = "event-row";
    row.innerHTML = `
      <input type="text" class="ev-name" placeholder="イベント名" value="${name.replace(/"/g, "&quot;")}">
      <input type="date" class="ev-date" value="${date}">
      <button type="button" class="remove-btn" aria-label="削除">×</button>
    `;
    row.querySelector(".remove-btn").addEventListener("click", () => row.remove());
    eventListEl.appendChild(row);
  }

  function openModal() {
    const data = loadData();

    $("inputName").value = data.oshiName || "";
    $("inputBirthday").value = data.birthday || "";

    eventListEl.innerHTML = "";
    const events = (data.events && data.events.length > 0) ? data.events : [{ name: "", date: "" }];
    events.forEach(ev => addEventRow(ev.name || "", ev.date || ""));

    modalError.textContent = "";
    $("resetConfirm").style.display = "none";
    modalOverlay.classList.add("open");
  }

  function closeModal() {
    modalOverlay.classList.remove("open");
  }

  function saveModal() {
    const oshiName = $("inputName").value.trim();
    const birthday = $("inputBirthday").value; // input[type=date]なので常にYYYY-MM-DD形式 or 空文字

    if (!birthday) {
      modalError.textContent = "推しの誕生日を入力してください。";
      return;
    }

    const events = [];
    eventListEl.querySelectorAll(".event-row").forEach(row => {
      const date = row.querySelector(".ev-date").value;
      if (!date) return; // 日付未入力の行は無視
      const name = row.querySelector(".ev-name").value.trim();
      events.push({ name: name || "次のイベント", date });
    });

    if (events.length === 0) {
      modalError.textContent = "イベントを1つ以上入力してください。";
      return;
    }

    saveData({ oshiName: oshiName || "推し", birthday, events });
    closeModal();
    render();
  }

  $("editBtn").addEventListener("click", openModal);
  $("cancelBtn").addEventListener("click", closeModal);
  $("saveBtn").addEventListener("click", saveModal);
  $("addEventBtn").addEventListener("click", () => addEventRow());
  modalOverlay.addEventListener("click", (e) => {
    if (e.target === modalOverlay) closeModal();
  });

  $("resetBtn").addEventListener("click", () => {
    $("resetConfirm").style.display = "block";
  });
  $("resetCancelBtn").addEventListener("click", () => {
    $("resetConfirm").style.display = "none";
  });
  $("resetConfirmBtn").addEventListener("click", () => {
    saveData(structuredClone(DEFAULT_DATA));
    closeModal();
    render();
  });

  // ===== 初期化 =====
  // 保存できない環境なら、さりげなく注意書きを出す
  if (!isStorageAvailable()) {
    $("storageWarning").style.display = "block";
  }

  // 既存データがなければ保存しておく（初回でも動く）
  try {
    if (!localStorage.getItem(STORAGE_KEY)) saveData(structuredClone(DEFAULT_DATA));
  } catch {
    saveData(structuredClone(DEFAULT_DATA));
  }

  render();
  setInterval(render, 60 * 60 * 1000); // 1時間ごと更新
</script>
</body>
</html>
